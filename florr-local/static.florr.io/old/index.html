<!DOCTYPE html>
<html>
<head>
<title>florr.io</title>

<meta name="description" content="Fight other flowers for garden dominance">

}

<style>

	margin: 0;
	padding: 0;

	font-weight: bold;
	cursor: default;
	text-align: center;
}

#status-container small {
	font-size: 50%;
}

#canvas {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	height: 100%;
	cursor: default;
}

#canvasOverlay {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
}

	display: none;
	position: absolute;
}

	background-color: transparent;
	font-family: 'Ubuntu';
	padding: 0;
	border: 0;
	outline: none;
}

<body>

<link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>
<div id="status-container">
	<span id="loading">Loading...</span>
	<span id="unsupported" style="display: none;">
		Your browser isn't supported<br />
		<small>
			try <a href="//chrome.google.com">Google Chrome</a> or <a href="https://www.mozilla.org/en-US/firefox/">Firefox</a><br />
		</small>
	</span>
	<span id="errorDialog" style="display: none;">
		Error<br />
		<small>
			Uninstall any scripts you may have,<br />as they might be interfering with the game<br />
		</small>
	</span>
</div>

<canvas id="canvas" width="800" height="800" style="display: none;" oncontextmenu="return false;"></canvas>

<div style="font-family:'Ubuntu'">&nbsp;</div>
<div id="textInputContainer"><input id="textInput" /></div>

<script>
/* ==== PROTOCOL CAPTURE HARNESS (Phase 1, removable) ====================
 * Passively taps the worker channel from the PAGE side only. Does NOT touch
 * the worker's own message handling, so it cannot break the connection.
 *   C2S = worker.postMessage(...) calls the game makes  (funcName sp_server_send = input)
 *   S2C = 'message' events from the worker              (data = server world updates)
 *
 * In DevTools console:
 *   __proto.count()       -> packets captured so far
 *   __proto.summary()     -> counts grouped by direction / funcName / length
 *   copy(__proto.dump())  -> full JSON capture to clipboard (save as capture1.json)
 *   __proto.mark(label)   -> insert a labeled marker into the log
 *   __proto.save(label)   -> POST the log to serve.js -> captures/<label>.json
 *   __proto.clear()       -> reset
 * Mouse/keyboard events are also logged (dir "IN") for correlation.
 * ====================================================================== */
(function(){
  var log = [];
  var seq = 0;
  function toU8(x){
    if(!x) return null;
    if(x instanceof Uint8Array) return x;
    if(x instanceof ArrayBuffer) return new Uint8Array(x);
    if(x.buffer instanceof ArrayBuffer) return new Uint8Array(x.buffer, x.byteOffset||0, x.byteLength);
    return null;
  }
  function hex(u8){
    if(!u8 || !u8.length) return "";
    var s="", n=u8.length;
    for(var i=0;i<n;i++){ var h=u8[i].toString(16); s+=(h.length<2?"0":"")+h; }
    return s;
  }
  function record(dir, name, u8, extra){
    var r = { seq: seq++, t: performance.now(), dir: dir, name: name||"",
              len: u8?u8.length:0, hex: hex(u8) };
    if(extra) for(var k in extra) r[k] = extra[k];
    log.push(r);
  }
  // Input events (dir "IN") so captures can be correlated with mouse/keyboard
  // actions. mousemove is throttled to one record per 50ms.
  var lastMove = 0;
  function inputRec(name, extra){ record("IN", name, null, extra); }
  window.addEventListener("keydown", function(e){ if(!e.repeat) inputRec("keydown", {key:e.key, code:e.code}); }, true);
  window.addEventListener("keyup", function(e){ inputRec("keyup", {key:e.key, code:e.code}); }, true);
  window.addEventListener("mousedown", function(e){ inputRec("mousedown", {button:e.button, x:e.clientX, y:e.clientY}); }, true);
  window.addEventListener("mouseup", function(e){ inputRec("mouseup", {button:e.button, x:e.clientX, y:e.clientY}); }, true);
  window.addEventListener("mousemove", function(e){
    var now = performance.now(); if(now - lastMove < 50) return; lastMove = now;
    inputRec("mousemove", {x:e.clientX, y:e.clientY, w:innerWidth, h:innerHeight});
  }, true);
  var diag = { post:0, onmsgSet:0, addEvt:0, s2c:0, c2s:0 };
  window.__proto = {
    log: log,
    diag: diag,
    count: function(){ return log.length; },
    clear: function(){ log.length=0; seq=0; return "cleared"; },
    dump: function(){ return JSON.stringify(log); },
    // Annotate the log, e.g. __proto.mark("kbd: hold W").
    mark: function(label){ record("MARK", label, null); return label; },
    // POST the capture to serve.js, which writes captures/<label>.json.
    save: function(label){
      return fetch("/__capture?label=" + encodeURIComponent(label), { method: "POST", body: JSON.stringify(log) })
        .then(function(r){ return r.text(); });
    },
    summary: function(){
      var by={}; log.forEach(function(r){
        var k=r.dir+" "+r.name+" len="+r.len; by[k]=(by[k]||0)+1;
      }); return by;
    }
  };

  // Patch Worker.prototype methods directly so we catch EVERY worker no matter
  // how it's constructed (blob URL, saved constructor ref, etc.).
  var WP = window.Worker && window.Worker.prototype;
  console.log("[proto] harness install, Worker present:", !!WP);
  if(WP){
    // C2S: every postMessage the page sends into a worker.
    var origPost = WP.postMessage;
    WP.postMessage = function(msg, transfer){
      try {
        diag.post++;
        if(diag.post <= 3) console.log("[proto] postMessage seen, keys:", msg && typeof msg === "object" ? Object.keys(msg) : typeof msg);
        if(msg && msg.funcName){ diag.c2s++; record("C2S", msg.funcName, toU8(msg.data), {cb: msg.callbackId}); }
      } catch(e){ console.warn("[proto] post hook err", e); }
      return origPost.apply(this, arguments);
    };
    // S2C via addEventListener("message", ...).
    var origAdd = WP.addEventListener;
    WP.addEventListener = function(type, fn, opts){
      if(type === "message" && typeof fn === "function"){
        diag.addEvt++;
        var wrapped = function(ev){
          try { var d=ev.data; if(d && d.data && !d.target){ diag.s2c++; record("S2C","response",toU8(d.data), {cb: d.callbackId, fin: !!d.finalResponse}); } } catch(e){}
          return fn.apply(this, arguments);
        };
        return origAdd.call(this, type, wrapped, opts);
      }
      return origAdd.apply(this, arguments);
    };
    // S2C via onmessage = ... (this is what the florr client actually uses).
    var onmsgDesc = Object.getOwnPropertyDescriptor(WP, "onmessage");
    console.log("[proto] onmessage descriptor:", onmsgDesc ? Object.keys(onmsgDesc) : "none",
                onmsgDesc && onmsgDesc.set ? "has-setter" : "no-setter");
    if(onmsgDesc && onmsgDesc.configurable && onmsgDesc.set){
      Object.defineProperty(WP, "onmessage", {
        configurable: true, enumerable: onmsgDesc.enumerable,
        get: onmsgDesc.get,
        set: function(fn){
          diag.onmsgSet++;
          if(diag.onmsgSet <= 3) console.log("[proto] onmessage assigned on a worker");
          if(typeof fn === "function"){
            var wrapped = function(ev){
              try { var d=ev.data; if(d && d.data && !d.target){ diag.s2c++; record("S2C","response",toU8(d.data), {cb: d.callbackId, fin: !!d.finalResponse}); } } catch(e){}
              return fn.apply(this, arguments);
            };
            onmsgDesc.set.call(this, wrapped);
          } else {
            onmsgDesc.set.call(this, fn);
          }
        }
      });
    }
  }
})();

/* ==== MULTIPLAYER TUNNEL ==================================================
 * With ?mp in the URL, the sp_server worker is replaced by a WebSocket to
 * server/index.js (/ws), which runs the server side. ?mp=host:port targets
 * another server. Without ?mp the original local worker is used.
 * Wire format matches server/index.js. Dropped connections resume the same
 * player via a session token (the server holds it for 45 s). The title screen's
 * spawn menu (spawn-menu.js) sends its loadout as func 5.
 * ====================================================================== */
(function(){
  var mp = new URL(window.location).searchParams.get("mp");
  if(mp === null) return;
  var host = mp || window.location.host;
  // client.wasm refuses to start on unknown hostnames (site lock); present as
  // localhost, which selects the sp_server worker path tunnelled below.
  window.__florrHostname = "localhost";
  var FUNCS = { sp_server_init:0, sp_server_send:1, sp_server_flush:2, sp_server_think:3 };
  var RealWorker = window.Worker;

  var WS_BASE = (location.protocol === "https:" ? "wss://" : "ws://") + host + "/ws";
  var SESSION_CB = -2;            // server -> page: session token (see server/index.js)
  var ALIVE_CB = -3;              // server -> page: player has a flower (1) or not (0)
  var OPTIONS_CB = -4;            // server -> page: room options JSON, e.g. {spawnMenu}
  var KEEPALIVE_MS = 5000;        // page -> server: func 4, keeps hidden tabs alive
  var GIVE_UP_MS = 40000;         // server holds a dropped player for 45 s
  var CLOSE_UNKNOWN_SESSION = 4000;

  // Small "Reconnecting..." banner; the game canvas keeps its last frame meanwhile.
  var banner = null;
  function showBanner(text){
    if(!banner){
      banner = document.createElement("div");
      banner.style.cssText = "position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;" +
        "background:rgba(0,0,0,.65);color:#fff;font:bold 16px Ubuntu,sans-serif;padding:8px 16px;border-radius:6px;pointer-events:none";
      document.body.appendChild(banner);
    }
    banner.textContent = text;
    banner.style.display = text ? "block" : "none";
  }

  // Same postMessage/onmessage interface as the sp_server worker, over a WebSocket.
  // If the socket drops, reconnect with the session token and resume the same
  // player; if the session is gone, reload the page to join fresh.
  function TunnelWorker(url){
    var self = this;
    this.onmessage = null;
    this.onerror = null;
    this._queue = [];          // outgoing frames before the first open
    this._session = null;
    this._closedByGame = false;
    this._offlineSince = 0;
    this._retryMs = 500;
    this._loadout = null;      // last spawn menu frame (func 5)
    this._connect();
    this._keepalive = setInterval(function(){
      if(self._ws && self._ws.readyState === 1) self._ws.send(new Uint8Array([4, 0, 0, 0, 0]));
    }, KEEPALIVE_MS);
  }
  TunnelWorker.prototype._connect = function(){
    var self = this;
    var ws = this._ws = new WebSocket(WS_BASE + (this._session ? "?session=" + this._session : ""));
    ws.binaryType = "arraybuffer";
    ws.onopen = function(){
      if(self._offlineSince){ console.log("[mp] reconnected"); showBanner(""); }
      self._offlineSince = 0;
      self._retryMs = 500;
      if(self._queue){ self._queue.forEach(function(b){ ws.send(b); }); self._queue = null; }
      if(self._loadout) ws.send(self._loadout); // (re)send the spawn menu's choice
    };
    ws.onmessage = function(ev){
      var v = new DataView(ev.data);
      var cb = v.getInt32(0, true);
      if(cb === SESSION_CB){
        self._session = new TextDecoder().decode(new Uint8Array(ev.data, 5));
        return;
      }
      if(cb === OPTIONS_CB){
        window.dispatchEvent(new CustomEvent("florr-options", { detail: JSON.parse(new TextDecoder().decode(new Uint8Array(ev.data, 5))) }));
        return;
      }
      if(cb === ALIVE_CB){
        window.dispatchEvent(new CustomEvent("florr-alive", { detail: new Uint8Array(ev.data)[5] === 1 }));
        return;
      }
      var data = ev.data.byteLength > 5 ? new Uint8Array(ev.data, 5) : 0;
      if(self.onmessage) self.onmessage({ data: { callbackId: cb, finalResponse: v.getUint8(4) === 1, data: data } });
    };
    ws.onclose = function(ev){
      if(self._ws !== ws || self._closedByGame) return;
      if(ev.code === CLOSE_UNKNOWN_SESSION || !self._session){
        console.warn("[mp] session ended; reloading to rejoin");
        showBanner("Rejoining...");
        setTimeout(function(){ location.reload(); }, 500);
        return;
      }
      if(!self._offlineSince) self._offlineSince = Date.now();
      if(Date.now() - self._offlineSince > GIVE_UP_MS){ location.reload(); return; }
      console.warn("[mp] connection lost; reconnecting");
      showBanner("Reconnecting...");
      setTimeout(function(){ self._connect(); }, self._retryMs);
      self._retryMs = Math.min(self._retryMs * 2, 4000);
    };
  };
  TunnelWorker.prototype.postMessage = function(msg){
    var payload = msg.data ? new Uint8Array(msg.data.buffer || msg.data, msg.data.byteOffset || 0, msg.data.byteLength || msg.data.length) : null;
    var len = payload ? payload.length : 0;
    var b = new Uint8Array(5 + len);
    b[0] = FUNCS[msg.funcName];
    new DataView(b.buffer).setInt32(1, msg.callbackId, true);
    if(payload) b.set(payload, 5);
    if(this._queue) this._queue.push(b);
    else if(this._ws.readyState === 1) this._ws.send(b);
    // While reconnecting, calls are dropped: flushes repeat every frame, and the
    // server ignores missing input counters.
  };
  // Spawn menu choice (JSON string, see loadout.js); kept and resent on reconnect.
  TunnelWorker.prototype.sendLoadout = function(json){
    var bytes = new TextEncoder().encode(json);
    var b = new Uint8Array(5 + bytes.length);
    b[0] = 5;
    b.set(bytes, 5);
    this._loadout = b;
    if(!this._queue && this._ws.readyState === 1) this._ws.send(b);
  };
  TunnelWorker.prototype.terminate = function(){
    this._closedByGame = true;
    clearInterval(this._keepalive);
    this._ws.close();
  };
  TunnelWorker.prototype.addEventListener = function(type, fn){ if(type === "message") this.onmessage = fn; };

  window.Worker = function(url, opts){
    if(String(url).indexOf("sp_server") >= 0){
      console.log("[mp] tunnelling " + url + " to ws://" + host + "/ws");
      return new TunnelWorker(url);
    }
    return new RealWorker(url, opts);
  };
  window.Worker.prototype = RealWorker.prototype;
})();

</script>
<script src="loadout.js"></script>
<script src="spawn-menu.js"></script>
<script>
window["Module"] = window["Module"] || {};
Module.canvas = document.getElementById("canvas");

function isBrowserSupported(){
	var canvas = document.createElement("canvas");
	if(!canvas || !canvas.getContext) return false;
	
	//var gl = canvas.getContext("webgl2") || canvas.getContext("experimental-webgl2");
	//if(!gl) return false;
	
	//if(!window["URL"] || !URL.createObjectURL) return false;
	
	return true;
}

(function(window, document){
	if(!isBrowserSupported()){
		document.getElementById("loading").style.display = "none";
		document.getElementById("unsupported").style.display = "block";
		document.getElementById("errorDialog").style.display = "none";
		return;
	}
	
	if(window.top != window.self){
		document.getElementById("loading").innerText = "Please visit florr.io directly";
		window.top.location = "https://florr.io/";
		return;
	}
	
	// Remove "cp6_version" from url, used during updates to skip cache
	var url = new URL(window.location);
	if(url.searchParams.get("cp6_version")){
		url.searchParams.delete("cp6_version");
		window.history.replaceState({}, document.title, url);
	}
	
	document.getElementById("canvas").style.display = "block";
	
	var gameScript = document.createElement('script');
	gameScript.async = true;
	gameScript.type = 'text/javascript';
	// Loading errors can happen shortly after an update if the file isn't quite ready at static storage when servers are up
	// Better to just try again instead of hanging. It's still really bad and shouldn't happen though.
	gameScript.onerror = function(){ setTimeout(function(){ window.location.reload(true); }, 500); };
	gameScript.onload = function(){};
	gameScript.src = "client.js";
	var node = document.getElementsByTagName('script')[0];
	node.parentNode.insertBefore(gameScript, node);
})(window, document);
</script>

<!-- Cloudflare RUM challenge + insights beacon removed for local/LAN serving (they call static.florr.io and error out) -->
</body>
</html>
