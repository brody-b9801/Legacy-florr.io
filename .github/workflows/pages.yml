# Publishes the webpage/ folder to GitHub Pages whenever it changes on master
name: Deploy webpage to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "webpage/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webpage
      - id: deployment
        uses: actions/deploy-pages@v4
